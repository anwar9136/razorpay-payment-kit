<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Payment Service — Test Checkout</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #9a9a9a; margin-top: 0; font-size: 14px; }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #9a9a9a;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #2a2e38;
    background: #0f1115;
    color: #e6e6e6;
    font-size: 14px;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #4f7cff;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3d68f0; }
  button:disabled { background: #3a3d45; cursor: not-allowed; }
  #log {
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 8px;
    padding: 14px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    max-height: 360px;
    overflow-y: auto;
    line-height: 1.5;
  }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .info { color: #60a5fa; }
</style>
</head>
<body>

  <h1>Payment Service — Test Checkout</h1>
  <p class="sub">Exercises the full create-order → Razorpay checkout → verify-payment flow against your local/ngrok server.</p>

  <div class="card">
    <label>Server Base URL</label>
    <input id="baseUrl" value="http://localhost:5000" placeholder="http://localhost:5000 or your ngrok URL" />

    <label>x-api-key (PAYMENT_SERVICE_API_KEY)</label>
    <input id="apiKey" placeholder="paste your API key here" />

    <label>Amount (₹)</label>
    <input id="amount" type="number" value="100" />

    <label>entityType</label>
    <input id="entityType" value="testOrder" />

    <label>entityId</label>
    <input id="entityId" value="test123" />

    <button id="payBtn">Pay ₹<span id="amtLabel">100</span></button>
  </div>

  <div class="card">
    <strong style="font-size:13px; color:#9a9a9a;">LOG</strong>
    <div id="log" style="margin-top:10px;">Waiting for action…</div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const logEl = document.getElementById("log");
    const amountInput = document.getElementById("amount");
    const amtLabel = document.getElementById("amtLabel");
    const payBtn = document.getElementById("payBtn");

    amountInput.addEventListener("input", () => {
      amtLabel.textContent = amountInput.value || "0";
    });

    function log(message, type = "") {
      const time = new Date().toLocaleTimeString();
      const span = document.createElement("div");
      span.className = type;
      span.textContent = `[${time}] ${message}`;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
      logEl.innerHTML = "";
    }

    payBtn.addEventListener("click", async () => {
      clearLog();
      payBtn.disabled = true;
      payBtn.textContent = "Processing...";

      const baseUrl = document.getElementById("baseUrl").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      const amount = Number(amountInput.value);
      const entityType = document.getElementById("entityType").value.trim();
      const entityId = document.getElementById("entityId").value.trim();

      if (!baseUrl || !apiKey) {
        log("Please fill in Server Base URL and API key.", "err");
        resetButton();
        return;
      }

      try {
        // 1. Create order
        log("Calling POST /api/payments/create-order ...", "info");

        const createRes = await fetch(`${baseUrl}/api/payments/create-order`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "Idempotency-Key": crypto.randomUUID()
          },
          body: JSON.stringify({
            amount,
            currency: "INR",
            receipt: `test-${Date.now()}`,
            entityType,
            entityId
          })
        });

        const createData = await createRes.json();

        if (!createRes.ok || !createData.success) {
          log(`create-order failed (${createRes.status}): ${createData.message || "Unknown error"}`, "err");
          if (createData.errors) log(JSON.stringify(createData.errors, null, 2), "err");
          resetButton();
          return;
        }

        log(`Order created: ${createData.orderId} (₹${createData.amount / 100})`, "ok");

        // 2. Open Razorpay Checkout
        const options = {
          key: createData.keyId,
          amount: createData.amount,
          currency: createData.currency,
          order_id: createData.orderId,
          name: "Payment Service Test",
          description: `Test payment — ${entityType}/${entityId}`,

          handler: async function (response) {
            log("Checkout completed. Verifying payment...", "info");
            log(`razorpay_payment_id: ${response.razorpay_payment_id}`);

            try {
              const verifyRes = await fetch(`${baseUrl}/api/payments/verify-payment`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-api-key": apiKey
                },
                body: JSON.stringify({
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature
                })
              });

              const verifyData = await verifyRes.json();

              if (verifyRes.ok && verifyData.success) {
                log(`Payment verified ✔ (${verifyData.message})`, "ok");
                log(`entityType: ${verifyData.entityType}, entityId: ${verifyData.entityId}`, "ok");
              } else {
                log(`Verification failed (${verifyRes.status}): ${verifyData.message}`, "err");
              }
            } catch (err) {
              log(`Verify-payment request error: ${err.message}`, "err");
            }

            resetButton();
          },

          modal: {
            ondismiss: function () {
              log("Checkout closed before completing payment.", "err");
              resetButton();
            }
          },

          theme: { color: "#4f7cff" }
        };

        const razorpay = new Razorpay(options);

        razorpay.on("payment.failed", function (response) {
          log(`Payment failed: ${response.error.description}`, "err");
          resetButton();
        });

        razorpay.open();

      } catch (err) {
        log(`Unexpected error: ${err.message}`, "err");
        resetButton();
      }
    });

    function resetButton() {
      payBtn.disabled = false;
      payBtn.textContent = `Pay ₹${amountInput.value}`;
    }
  </script>

</body>
</html>
